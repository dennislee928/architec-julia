# Track A 雲端 A/B 驗證管線 — 同一次 run 內建置「原版 julia」與「本專案補丁版」，
# 量測方法無效化（using REPL / using DataFrames），並直接輸出改善幅度對照表
# （GitHub Actions run summary + artifact）。
#
# 觸發：Actions 頁面手動（workflow_dispatch）。兩個 build job 並行（各 ~1.5–2.5 h），
# compare job 匯總。注意：julia 預設分支是 `master`，不是 `main`。
name: core-invalidation-validation

on:
  workflow_dispatch:
    inputs:
      baseline_repo:
        description: "Baseline julia repo"
        required: true
        default: "JuliaLang/julia"
      baseline_ref:
        description: "Baseline ref (julia's default branch is `master`)"
        required: true
        default: "master"
      patched_repo:
        description: "Patched julia repo (this project's fork)"
        required: true
        default: "dennislee928/julia"
      patched_ref:
        description: "Patched ref (the invalidation-caching series)"
        required: true
        default: "avoid-absint-interface-invalidation"

jobs:
  build-measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: baseline
            repo: ${{ inputs.baseline_repo }}
            ref: ${{ inputs.baseline_ref }}
          - side: patched
            repo: ${{ inputs.patched_repo }}
            ref: ${{ inputs.patched_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Validate repo/ref before the expensive part (fail fast)
        run: |
          if ! git ls-remote --exit-code "https://github.com/${{ matrix.repo }}" \
              "refs/heads/${{ matrix.ref }}" "refs/tags/${{ matrix.ref }}"; then
            echo "::error::ref '${{ matrix.ref }}' not found on ${{ matrix.repo }} (julia's default branch is 'master')."
            exit 1
          fi

      - name: Free runner disk space (julia build needs ~20 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout Julia source (${{ matrix.side }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: julia

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran perl python3 m4 cmake pkg-config curl

      - name: Build Julia (binary deps via BinaryBuilder)
        working-directory: julia
        run: make -j"$(nproc)"

      - name: Measure invalidations (REPL + DataFrames)
        working-directory: julia
        run: |
          ./usr/bin/julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add(["SnoopCompileCore", "SnoopCompile", "DataFrames"])
            function measure(pkg::String)
                # each measurement in a fresh process for clean JIT state
                script = """
                    using Pkg; Pkg.activate(\"$(Base.active_project())\"; io=devnull)
                    using SnoopCompileCore
                    invs = @snoop_invalidations @eval using $pkg
                    using SnoopCompile
                    trees = invalidation_trees(invs)
                    println(\"METRIC \", length(uinvalidated(invs)), \" \", length(trees))
                    for t in trees[max(1, end - 4):end]
                        show(stdout, t); println(\"\\n\", \"-\"^70)
                    end
                """
                io = IOBuffer()
                run(pipeline(`$(Base.julia_cmd()) --startup-file=no -e $script`; stdout=io, stderr=devnull))
                out = String(take!(io))
                m = match(r"METRIC (\d+) (\d+)", out)
                return (parse(Int, m.captures[1]), parse(Int, m.captures[2]), out)
            end
            open("../metrics-${{ matrix.side }}.env", "w") do env
                open("../report-${{ matrix.side }}.txt", "w") do rep
                    for pkg in ("REPL", "DataFrames")
                        (n, t, out) = measure(pkg)
                        println(env, lowercase(pkg), "_unique=", n)
                        println(env, lowercase(pkg), "_trees=", t)
                        println(rep, "===== using ", pkg, " =====\n", out)
                    end
                end
            end
            println(read("../metrics-${{ matrix.side }}.env", String))'

      - name: Upload measurement
        uses: actions/upload-artifact@v4
        with:
          name: invalidation-${{ matrix.side }}
          path: |
            metrics-${{ matrix.side }}.env
            report-${{ matrix.side }}.txt

  compare:
    needs: build-measure
    runs-on: ubuntu-latest
    steps:
      - name: Download both measurements
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute and publish the enhancement degree
        run: |
          python3 - <<'EOF'
          def load(side):
              d = {}
              for line in open(f"metrics-{side}.env"):
                  k, v = line.strip().split("=")
                  d[k] = int(v)
              return d
          b, p = load("baseline"), load("patched")
          lines = [
              "# Invalidation A/B: baseline vs patched",
              "",
              "| Metric | Baseline (${{ inputs.baseline_repo }}@${{ inputs.baseline_ref }}) | Patched (${{ inputs.patched_repo }}@${{ inputs.patched_ref }}) | Δ | Improvement |",
              "|---|---:|---:|---:|---:|",
          ]
          for key, label in [("repl_unique", "`using REPL` invalidated methods"),
                             ("repl_trees", "`using REPL` invalidation trees"),
                             ("dataframes_unique", "`using DataFrames` invalidated methods"),
                             ("dataframes_trees", "`using DataFrames` invalidation trees")]:
              delta = p[key] - b[key]
              pct = (100.0 * delta / b[key]) if b[key] else 0.0
              lines.append(f"| {label} | {b[key]} | {p[key]} | {delta:+d} | {-pct:.1f}% |")
          lines += ["", "Full per-side tree dumps are in the `invalidation-baseline` / `invalidation-patched` artifacts."]
          report = "\n".join(lines)
          print(report)
          open("comparison.md", "w").write(report + "\n")
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report + "\n")
          EOF

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: invalidation-comparison
          path: comparison.md
